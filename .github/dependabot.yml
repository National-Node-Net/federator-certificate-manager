version: 2
updates:
  - package-ecosystem: "maven"
    target-branch: "develop"
    directory: "/"
    registries: "*"
    schedule:
      interval: "daily"
    groups:
      maven-dependencies:
        patterns:
          - "*"
  # target-branch intentionally omitted: action updates target main (auto-merged) and are back-merged to develop.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"